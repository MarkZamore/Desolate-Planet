name: Publish Desolate Planet controls preset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - launcher/controls-preset.txt
      - tools/keybinds/**
      - .github/workflows/publish.yml

concurrency:
  group: desolate-planet-pack-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate keyboard preset
        run: python -B tools/keybinds/check_preset.py
      - name: Publish pack-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/keybinds/publish.py
